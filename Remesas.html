<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Remesas Jeje</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0D2B45;
  color:white;
  text-align:center;
  padding:60px 20px;
}

h1{
  font-size:42px;
}

.tasa{
  font-size:55px;
  margin:20px 0;
}

.btn{
  display:inline-block;
  padding:20px 40px;
  background:#25D366;
  color:white;
  font-size:22px;
  border-radius:40px;
  text-decoration:none;
}
</style>
</head>

<body>

<h1>REMESAS JEJE</h1>

<div class="tasa" id="tasa">170.00 Bs</div>

<!-- 🔥 BOTÓN BASE (NO FALLA) -->
<a id="btn"
   class="btn"
   href="https://web.whatsapp.com/send?phone=51954179397"
   target="_blank">
📲 ENVIAR POR WHATSAPP
</a>

<script>

// 🔥 CONFIG
let tasa = 170.00;
let numero = "51954179397";

// mostrar tasa
document.getElementById("tasa").innerText = tasa + " Bs";

// detectar móvil REAL
function esMovil(){
  return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
}

// mensaje
let mensaje = `Hola, quiero aprovechar la tasa de ${tasa} Bs para enviar dinero a Venezuela`;
let texto = encodeURIComponent(mensaje);

// 🔥 CAMBIO SEGURO DEL LINK
let boton = document.getElementById("btn");

if(esMovil()){
  // móvil → app
  boton.href = `https://wa.me/${numero}?text=${texto}`;
}else{
  // PC → web (el que ya te funciona)
  boton.href = `https://web.whatsapp.com/send?phone=${numero}&text=${texto}`;
}

</script>

</body>
</html>
